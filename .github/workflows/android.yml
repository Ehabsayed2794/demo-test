name: Android (Native Kotlin)

# Phase 0b: toolchain is API-36 / AGP 8.13.2 / Gradle 8.14.3. The Gradle
# wrapper is now committed under native/, so this job runs it directly and no
# longer pins a distribution via setup-gradle. JS workflows are untouched.
on:
  pull_request:
    branches:
      - main
    paths:
      - native/**
      - tests/native-phase3-*.test.cjs
      - firestore.rules
      - .github/workflows/android.yml
  push:
    branches:
      - main
    paths:
      - native/**
      - tests/native-phase3-*.test.cjs
      - firestore.rules
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        # NOTE: android-actions/setup-android@v3 is unusable — it hard-installs
        # the obsolete `tools` package, which Google removed from the SDK
        # repository (sdkmanager exits 1: "Failed to find package 'tools'").
        # The ubuntu runner image already ships an SDK; install exactly the
        # packages AGP 8.13 needs (compileSdk 36 + build-tools 35.0.0) and
        # accept licenses non-interactively.
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          # `yes` dies with SIGPIPE once sdkmanager exits — expected noise,
          # not a failure (pipefail would fail the step on it). A genuinely
          # unlicensed SDK still fails loudly at --install below.
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle (wrapper is committed)
        # No gradle-version override: the committed wrapper pins 8.14.3.
        # setup-gradle still supplies the dependency cache.
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug + run unit tests (app + engine + services)
        # The wrapper lives at native/gradlew; -p native sets the project dir.
        # assembleDebugAndroidTest compiles the :services instrumented suite
        # here so a compile error in androidTest fails in ~2 minutes instead
        # of after the instrumented job has booted an emulator.
        # testQaUnitTest runs the SAME unit tests against the qa variant's
        # BuildConfig — BuildVariantWiringTest asserts the real-project +
        # .qa-suffix wiring, which only this task exercises.
        run: native/gradlew -p native :app:assembleDebug :app:testDebugUnitTest :app:testQaUnitTest :engine:test :services:test :services:assembleDebugAndroidTest --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            native/app/build/reports/tests/
            native/engine/build/reports/tests/
            native/services/build/reports/tests/
          if-no-files-found: warn

  # Phase 0b (S4) — the release gate. assembleRelease must build, sign, and
  # carry the REAL Firebase project. The keystore comes from repo secrets
  # when configured; otherwise a fresh ephemeral key signs the build so the
  # job is never blocked on secret setup. Either way the APK must verify.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide signing keystore
        # RELEASE_STORE_FILE etc. are set only when the owner configures the
        # repo secrets. Absent them, an ephemeral key signs this build — the
        # point is that assembleRelease always produces a verifiable APK.
        env:
          STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd native
          if [ -n "$STORE_FILE" ] && [ -n "$STORE_BASE64" ]; then
            echo "Signing with the production keystore from repo secrets."
            echo "$STORE_BASE64" | base64 -d > "$STORE_FILE"
          else
            echo "No production keystore secret configured — generating an ephemeral key."
            STORE_FILE="$RUNNER_TEMP/ephemeral-release.jks"
            keytool -genkeypair -noprompt \
              -keystore "$STORE_FILE" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Estemshan ephemeral CI, OU=CI, O=Estemshan, L=Cairo, C=EG"
            STORE_PASSWORD=android
            KEY_ALIAS=androiddebugkey
            KEY_PASSWORD=android
          fi
          cat > keystore-release.properties <<EOF
          storeFile=$STORE_FILE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release
        run: native/gradlew -p native :app:assembleRelease --stacktrace

      - name: Verify signed + built against the real Firebase project
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="native/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "release APK missing"; exit 1; }
          # 1. Signed and verifiable.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          # 2. Carries the REAL project id, not the dummy demo-test-ci one.
          #    (demo-test-ci still appears in the emulator branch of the same
          #    compiled class, so its ABSENCE cannot be asserted — the real
          #    id's PRESENCE is the meaningful check.) BuildConfig string
          #    constants may land in ANY of the classes*.dex files, not just
          #    classes.dex, so scan them all.
          DEX_DIR="$(mktemp -d)"
          unzip -o -q "$APK" 'classes*.dex' -d "$DEX_DIR"
          grep -a -q "made---estimation-card-game" "$DEX_DIR"/classes*.dex \
            || { echo "release APK missing the real Firebase project id"; ls -la "$DEX_DIR"; exit 1; }
          echo "Release APK signed and targets made---estimation-card-game."
          rm -rf "$DEX_DIR"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: estemshan-release-apk
          path: native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # S21 prerequisite — Firebase App Distribution (free tier, no server of
  # ours — fits decision D3). The qa build type targets the REAL Firebase
  # project (never the 10.0.2.2 emulators) but stays debuggable and
  # dev-signed, so a tester's phone runs the same backend release does
  # without a store listing or a production keystore. Every main push ships
  # the build to the estemshan-qa tester group; pull requests build and
  # verify it but do not distribute — a per-PR tester release would drown
  # the group. One-time setup: docs/release/HUMAN_QA.md.
  qa-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js (firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble qa
        run: native/gradlew -p native :app:assembleQa --stacktrace

      - name: Verify the qa APK targets the real project, as a separate app
        # Same reasoning as the release job: the dummy demo-test-ci is still
        # compiled into the shared FirebaseModule class, so only the real
        # id's PRESENCE is a meaningful check. The package-name half is
        # qa-specific: it proves applicationIdSuffix survived the build.
        # Without it the qa APK overwrites the debug one on a tester's phone
        # and the surviving app silently talks to the emulator project.
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK="native/app/build/outputs/apk/qa/app-qa.apk"
          test -f "$APK" || { echo "qa APK missing"; exit 1; }
          DEX_DIR="$(mktemp -d)"
          unzip -o -q "$APK" 'classes*.dex' -d "$DEX_DIR"
          grep -a -q "made---estimation-card-game" "$DEX_DIR"/classes*.dex \
            || { echo "qa APK missing the real Firebase project id"; ls -la "$DEX_DIR"; exit 1; }
          rm -rf "$DEX_DIR"
          PACKAGE="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump packagename "$APK")"
          echo "qa APK package: $PACKAGE"
          test "$PACKAGE" = "com.estemshan.game.qa" \
            || { echo "qa APK lost its .qa applicationIdSuffix"; exit 1; }
          echo "qa APK targets made---estimation-card-game as com.estemshan.game.qa."

      - name: Upload qa APK
        uses: actions/upload-artifact@v4
        with:
          name: estemshan-qa-apk
          path: native/app/build/outputs/apk/qa/*.apk
          if-no-files-found: error

      - name: Distribute to the estemshan-qa tester group
        # main pushes only, so PR builds never spam the testers. Skipped —
        # not failed — until the one-time setup lands, because the owner
        # has not created the credential yet. A placeholder app id here
        # makes firebase-cli fail with an unhelpful 404, so it is treated
        # as "not configured" alongside an absent credential. The first
        # main push after setup is the upload's own verification.
        if: github.event_name == 'push'
        env:
          CREDENTIALS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_CREDENTIALS }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          APK="native/app/build/outputs/apk/qa/app-qa.apk"
          PLACEHOLDER="1:261597513798:android:00000000000000000000000000000000"
          if [ -z "$CREDENTIALS" ] || [ -z "$FIREBASE_APP_ID" ] || [ "$FIREBASE_APP_ID" = "$PLACEHOLDER" ]; then
            echo "::warning::Firebase App Distribution is not configured yet — skipping the upload."
            echo "::warning::Do the one-time setup in docs/release/HUMAN_QA.md, then add two repo secrets:"
            echo "::warning::  FIREBASE_APP_DISTRIBUTION_CREDENTIALS  the service-account JSON, raw or base64"
            echo "::warning::  FIREBASE_APP_ID                        the Android app id from the Firebase console"
            echo "::warning::The next main push after that distributes the build. The APK is already on this run's artifacts."
            exit 0
          fi
          # The secret may hold the service-account JSON itself or its base64
          # encoding — either is one paste action in the GitHub UI. Assuming
          # base64 made the step die on `base64: invalid input` the first time
          # the owner configured it, so decode only when the payload is not
          # already JSON. Raw JSON always fails base64 -d on its first { or ",
          # so a failing decode IS the detector; the if-condition keeps
          # pipefail from aborting the job on that expected failure.
          CREDENTIALS_FILE="$RUNNER_TEMP/app-distribution.json"
          if printf '%s' "$CREDENTIALS" | base64 -d > "$CREDENTIALS_FILE" 2>/dev/null; then
            echo "Decoded the credential from base64."
          else
            printf '%s' "$CREDENTIALS" > "$CREDENTIALS_FILE"
            echo "Used the credential as-is (raw JSON)."
          fi
          # Report a garbled secret here instead of letting firebase-cli
          # surface it as an opaque auth failure further down the log.
          FIRST=$(tr -d '[:space:]' < "$CREDENTIALS_FILE" | cut -c1)
          if [ "$FIRST" != "{" ]; then
            echo "::error::FIREBASE_APP_DISTRIBUTION_CREDENTIALS is neither valid base64 nor a service-account JSON object."
            exit 1
          fi
          npx firebase appdistribution:distribute "$APK" \
            --service-credentials-file "$CREDENTIALS_FILE" \
            --app "$FIREBASE_APP_ID" \
            --groups "estemshan-qa" \
            --release-notes "$COMMIT_MESSAGE"

  # S20 (plan §2D) — the instrumented 4-client emulator suite: four real
  # MatchService instances in one Android emulator, four real signed-in
  # users, against the host Firestore + Auth emulators, with the REAL
  # firestore.rules enforced. This is the only place real Kotlin hits real
  # rules end to end — R8's "unavoidable" tier. Every shared transition
  # (deal, advance, extend, endMatch, the rematch vote and its match) is
  # raced by all four clients at once, and the suite asserts CONVERGENCE
  # (all four agree), never which client won: the emulator has zero
  # transaction retry, so a race winner is luck and a race loser must land
  # as a RETURNED idempotent no-op, never an error.
  #
  # Job order: after `build` so a compile or unit-test failure never spins
  # up an emulator. ubuntu-latest (2-3x faster than macOS for this) with
  # KVM enabled for hardware acceleration.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM for the Android emulator
        # Without this the emulator falls back to software emulation and
        # the suite times out. The ubuntu image has KVM but locks it to
        # the kvm group; this rule opens the device to the runner user.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js (firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the Firestore + Auth emulators on the host
        # Auth is not optional: firestore.rules requires request.auth != null
        # on every match write, so the suite signs four real anonymous users
        # in against it. Ports are firebase.json's (firestore 8080, auth
        # 9099); the Android emulator reaches them via 10.0.2.2, the host
        # loopback as seen from inside the guest.
        #
        # firebase-tools also writes firestore-debug.log / firebase-debug.log
        # to this directory; the artifact step below uploads them because
        # that is the ONLY place a rules-evaluation failure is recorded with
        # its exact CEL expression — the client SDK only surfaces
        # "permission-denied" with a line number, never which clause threw.
        run: |
          set -euo pipefail
          npx firebase emulators:start --project demo-test-ci --only firestore,auth \
            > "$RUNNER_TEMP/emulators.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulators.pid"
          # Readiness probe — a bounded wait on a real condition (the ports
          # accepting connections), not a fixed sleep: the suite is only
          # started once both emulators actually answer.
          for port in 8080 9099; do
            for i in $(seq 1 180); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/" || true)
              if [ "$code" != "000" ]; then
                echo "port $port is answering (HTTP $code after ${i}s)."
                break
              fi
              sleep 1
              if [ "$i" = "180" ]; then
                echo "emulator on port $port never became ready"; cat "$RUNNER_TEMP/emulators.log"; exit 1
              fi
            done
          done

      - name: Run the 4-client suite in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 36 to match compileSdk/targetSdk; google_apis so Play
          # Services base is present for Firebase Auth; x86_64 for KVM.
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # connectedDebugAndroidTest builds the debug variant's androidTest
          # and runs it on the attached emulator (debug's USE_EMULATOR is
          # true, matching :app's FirebaseModule).
          script: native/gradlew -p native :services:connectedDebugAndroidTest --stacktrace

      - name: Collect the emulator debug logs
        # The Firestore emulator's own rules-evaluation detail lands in
        # firestore-debug.log (named in the emulator banner), written to the
        # directory the emulators were started from — the repo root here.
        # Copied BEFORE the emulators are stopped so a SIGTERM cannot
        # truncate the final flush of a denial this very run produced.
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/emulator-logs"
          for f in firestore-debug.log firebase-debug.log; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/emulator-logs/$f" || true
          done

      - name: Stop the host emulators
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/emulators.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulators.pid")" 2>/dev/null || true
          fi

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            native/services/build/reports/androidTests/
            native/services/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulators.log
            ${{ runner.temp }}/emulator-logs/
          if-no-files-found: warn

  # Phase 3 — the rules layer the Kotlin services write against, proven
  # against the REAL, UNCHANGED firestore.rules. The services themselves
  # are unit-tested above; this job compiles the actual rules and proves
  # every transaction shape the services emit is ACCEPTED while every
  # malformed variant is DENIED (a wrong shape is a rules denial, not a
  # style issue). Headless: `emulators:exec` starts the Firestore
  # emulator, runs the suite, tears it down in a finally, and propagates
  # the real exit code — the same pattern r1-golden-verification.yml
  # already proves. The full JS suite stays in test.yml; this job runs
  # only the Phase 3 files.
  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17 for the Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 3 rules + integration suites against the Firestore Emulator
        # --only firestore: these suites need no Auth/browser emulator.
        # Each file is its own process — one crash cannot mask another's
        # results, exactly like scripts/run-tests.mjs's own per-file model.
        run: |
          npx firebase emulators:exec --project demo-test-ci --only firestore "node tests/native-phase3-rules-negative.test.cjs"
          npx firebase emulators:exec --project demo-test-ci --only firestore "node tests/native-phase3-integration.test.cjs"
        # No continue-on-error: an unreachable emulator, a rules denial of
        # a legitimate shape, or an ACCEPTED malformed shape all fail here.
