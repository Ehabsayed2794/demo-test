name: apk-debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync Capacitor config
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify live URL baked into APK
        run: |
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/capacitor.config.json | grep -F "made---estimation-card-game.web.app" || { echo "FATAL: server.url NOT baked into APK"; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: estemshan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
