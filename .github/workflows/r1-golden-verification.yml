name: R1 Golden Verification (Manual)

# Isolated R1 verification only — runs the full 4-client Golden Path
# against the real Firestore Rules Emulator and checks Gate 3.3
# (52 total / 52 unique). Manual trigger + automatic on every PR
# targeting main and every push to main. Does not modify,
# replace, or duplicate test.yml / deploy-production.yml / apk-debug.yml.
#
# Proves: scripts/golden-path.mjs PASS 3.3 with 4 real browser contexts.
# Does NOT prove production. MOCK PASS != EMULATOR PASS.
#
# NOTE: this intentionally runs on ALL PRs to main with no paths filter
# (not just rules/game-code touches). A paths filter would let a PR that
# only touches CI config or tests merge without ever executing
# `node scripts/golden-path.mjs`, which defeats the required guarantee
# that the golden check runs on every PR targeting main. Kept OUT of
# test.yml on purpose (the golden run takes minutes; test:ci stays fast).

on:
  workflow_dispatch:
  # Merge protection: run the Golden Path automatically on every PR
  # targeting main and every push to main, so the check in
  # `node scripts/golden-path.mjs` always executes and its result is
  # always shown on the PR. Feature/Claude branches are covered at PR
  # time, not on every push (the golden run takes minutes).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref (rapid pushes / PR syncs) so
# runners aren't wasted; the latest commit is always fully checked.
# This never reduces coverage -- it only drops stale, outdated runs.
concurrency:
  group: r1-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r1-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run R1 Golden Path against Firestore Emulator
        env:
          EVIDENCE_DIR: /tmp/golden-path
        run: npx firebase emulators:exec --project demo-test-ci --only firestore,auth "node scripts/golden-path.mjs"
        # No continue-on-error: any non-zero exit (emulator not started,
        # golden-path.mjs exit != 0, Gate 3.3 52-unique failure, fatal test
        # failure) fails this step and the job. No fallback to PASS.

      - name: Upload Golden Path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-golden-evidence
          path: /tmp/golden-path
          if-no-files-found: warn
          retention-days: 30
