name: R1 Golden Verification (Manual)

# Isolated R1 verification only — runs the full 4-client Golden Path
# against the real Firestore Rules Emulator and checks Gate 3.3
# (52 total / 52 unique). Manual trigger + automatic on PRs targeting
# main that touch rules/game code (P0-3). Does not modify,
# replace, or duplicate test.yml / deploy-production.yml / apk-debug.yml.
#
# Proves: scripts/golden-path.mjs PASS 3.3 with 4 real browser contexts.
# Does NOT prove production. MOCK PASS != EMULATOR PASS.

on:
  workflow_dispatch:
  # P0-3 merge protection: run the Golden Path automatically when a PR
  # targeting main touches rules, game code, or the harness itself.
  # Kept OUT of test.yml on purpose (the golden run takes minutes;
  # test:ci stays fast).
  pull_request:
    branches:
      - main
    paths:
      - firestore.rules
      - design-ui/**
      - scripts/golden-path.mjs
      - .github/workflows/r1-golden-verification.yml

permissions:
  contents: read

jobs:
  r1-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run R1 Golden Path against Firestore Emulator
        env:
          EVIDENCE_DIR: /tmp/golden-path
        run: npx firebase emulators:exec --project demo-test-ci --only firestore,auth "node scripts/golden-path.mjs"
        # No continue-on-error: any non-zero exit (emulator not started,
        # golden-path.mjs exit != 0, Gate 3.3 52-unique failure, fatal test
        # failure) fails this step and the job. No fallback to PASS.

      - name: Upload Golden Path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-golden-evidence
          path: /tmp/golden-path
          if-no-files-found: warn
          retention-days: 30
